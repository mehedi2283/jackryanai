  <head>
    <meta charset="UTF-8" />

    <title>JackRyanAI - Secure Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      /* Global Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4d4d8; /* zinc-300 */
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a1a1aa; /* zinc-400 */
      }
      
      /* Smooth Animations */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(4px) scale(0.99); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      
      .animate-fade-in-up {
        animation: fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Specific Animation for Centered Floating Elements */
      @keyframes fadeInUpCentered {
        from { opacity: 0; transform: translate(-50%, 12px) scale(0.95); }
        to { opacity: 1; transform: translate(-50%, 0) scale(1); }
      }

      .animate-fade-in-up-centered {
        animation: fadeInUpCentered 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .animate-fade-in {
        animation: fadeInUp 0.2s ease-out forwards;
      }

      /* Transitions for Grid Expansion */
      .transition-grid-rows {
        transition: grid-template-rows 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease-in-out;
      }

      /* Customizing Native Autofill Style */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
        -webkit-background-clip: text;
        -webkit-text-fill-color: #111827;
        transition: background-color 5000s ease-in-out 0s;
        box-shadow: inset 0 0 20px 20px rgba(255, 255, 255, 0);
      }
    </style>
